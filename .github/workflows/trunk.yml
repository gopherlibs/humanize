name: "Trunk WF"

on:
  push:
    branches:
    - trunk

jobs:
  build-alpha:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - uses: goreleaser/goreleaser-action@v7
      with:
        version: '2.15.4'
        args: "release --snapshot"
